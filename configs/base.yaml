# Shared by every condition. Overridden only by the fields each file names.
num_drones: 5          # ⛔ trained at N=5 ONLY -- training off-N turns RQ2's
                       # zero-shot columns into in-distribution tests
env_steps: 10_000_000  # transitions, not batched calls
num_envs: 1024         # chosen on LEARNING grounds; the env is not the bottleneck
architecture: mlp
seeds: [0, 1, 2, 3, 4] # >=5 for anything reported

learner:
  rollouts: 32
  learning_epochs: 4
  mini_batches: 4
  learning_rate: 3.0e-4
  entropy_loss_scale: 0.0
  # Not skrl defaults, and two of the three fail silently. Applied by
  # training.skrl_wrapper.mappo_cfg(); listed here so a reader of the config
  # knows they are set.
  discount_factor: 0.997      # == core.GAMMA; the PBRS proof needs both equal
  time_limit_bootstrap: true
  value_preprocessor: RunningStandardScaler

# ⚠️ IDENTICAL IN EVERY CONDITION. Fixed by step count, never adaptive:
# adaptive advancement hands the easier rungs more experience at the final
# stage and confounds RQ1 unrecoverably.
curriculum:
  boundaries: [0.15, 0.35, 0.60]   # PROVISIONAL -- freeze after the G4 sweep
  mix: 0.2                         # share of episodes from earlier stages

evaluation:
  fidelity: F4        # every RQ1 number, whatever the policy trained under
  eval_routes: true   # the held-out split; the only generalisation check left
  n: [3, 5, 8]        # zero-shot; analytical weight at N = 8
