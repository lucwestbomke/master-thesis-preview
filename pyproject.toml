[project]
name = "uav-swarm-marl"
version = "0.1.0"
description = "Throughput-aware MARL for jam-resilient UAV relay swarms"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "torch-geometric",
    "skrl",
    "pettingzoo",
    "osmnx",
    "shapely",
    "geopandas",
    "numpy",
    "matplotlib",
    "wandb",
    "hydra-core",
    "imageio",
    "imageio-ffmpeg",
    "gymnasium>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
